<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schaakklok">
<meta name="theme-color" content="#14161a">
<!-- BODY-START -->
<title>Schaakklok Drie</title>
<style>
  :root {
    --ground: #14161a;
    --ink: #ecedef;
    --ink-dim: #8b8f97;
    --panel: #22252b;
    --panel-edge: #33373f;
    --blue: #2ff3ff;
    --yellow: #ffee33;
    --red: #ff6b6b;
    --on-color: #101214;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-rows: 1fr 1fr 1fr auto;
    gap: 12px;
  }
  @media (orientation: landscape) {
    .app {
      grid-template-rows: 1fr auto;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .controls { grid-column: 1 / -1; }
  }

  /* ── Player buttons ───────────────────────────── */
  .player {
    position: relative;
    -webkit-appearance: none; appearance: none;
    border: 3px solid var(--c);
    border-radius: 28px;
    background: color-mix(in srgb, var(--c) 14%, var(--ground));
    color: var(--c);
    width: 100%; height: 100%; min-height: 0;
    padding: 0;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease, transform 80ms ease;
    outline: none;
    touch-action: manipulation;
  }
  .player:focus-visible { box-shadow: 0 0 0 4px var(--ink); }
  .player:active { transform: scale(0.985); }
  .player.active {
    background: var(--c);
    color: var(--on-color);
    box-shadow: 0 0 40px 4px color-mix(in srgb, var(--c) 55%, transparent);
  }
  .player .time {
    font-size: clamp(30px, 6.5vh, 48px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .player .turn {
    position: absolute; top: 14px; left: 0; right: 0;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .player.active .turn { opacity: 0.75; }
  .player.paused-active .turn { opacity: 0.5; }
  @media (orientation: landscape) {
    .player .time { font-size: clamp(28px, 7vw, 56px); }
  }

  /* ── Controls ─────────────────────────────────── */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: center;
  }
  .ctl {
    -webkit-appearance: none; appearance: none;
    border: 2px solid var(--panel-edge);
    border-radius: 18px;
    background: var(--panel);
    color: var(--ink);
    font: inherit; font-size: 20px; font-weight: 600;
    min-height: 60px;
    padding: 0 18px;
    cursor: pointer;
    touch-action: manipulation;
    outline: none;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ctl:focus-visible { border-color: var(--ink); }
  .ctl:active { background: var(--panel-edge); }
  .ctl.confirm { background: var(--red); border-color: var(--red); color: var(--on-color); }
  .status {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    min-height: 1.2em;
  }
  @media (prefers-reduced-motion: reduce) {
    .player, .ctl, .player .turn { transition: none; }
  }
</style>

<div class="app">
  <button class="player" id="p0" style="--c: var(--blue)" aria-label="Blauw">
    <span class="turn">Aan zet</span>
    <span class="time" id="t0">00:00:00</span>
  </button>
  <button class="player" id="p1" style="--c: var(--yellow)" aria-label="Geel">
    <span class="turn">Aan zet</span>
    <span class="time" id="t1">00:00:00</span>
  </button>
  <button class="player" id="p2" style="--c: var(--red)" aria-label="Rood">
    <span class="turn">Aan zet</span>
    <span class="time" id="t2">00:00:00</span>
  </button>
  <div class="controls">
    <button class="ctl" id="pause">Pauze</button>
    <button class="ctl" id="reset">Reset</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  var KEY = 'schaakklok3';
  var state = { times: [0, 0, 0], active: null, running: false, since: 0 };

  // ── persistence (per-device convenience; survives an accidental reload) ──
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.times && s.times.length === 3) {
        state = s;
        if (state.running) { state.times[state.active] += Date.now() - state.since; state.since = Date.now(); }
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ── clock ───────────────────────────────────────
  function elapsed(i) {
    var t = state.times[i];
    if (state.running && state.active === i) t += Date.now() - state.since;
    return t;
  }
  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function commit() {
    if (state.running) { state.times[state.active] += Date.now() - state.since; }
    state.since = Date.now();
  }

  var btns = [0, 1, 2].map(function (i) { return document.getElementById('p' + i); });
  var times = [0, 1, 2].map(function (i) { return document.getElementById('t' + i); });
  var pauseBtn = document.getElementById('pause');
  var resetBtn = document.getElementById('reset');
  var statusEl = document.getElementById('status');

  function render() {
    for (var i = 0; i < 3; i++) {
      times[i].textContent = fmt(elapsed(i));
      btns[i].classList.toggle('active', state.active === i && state.running);
      btns[i].classList.toggle('paused-active', state.active === i && !state.running);
    }
    pauseBtn.textContent = state.running ? 'Pauze' : (state.active === null ? 'Pauze' : 'Hervat');
    pauseBtn.disabled = state.active === null;
    pauseBtn.style.opacity = state.active === null ? 0.4 : 1;
  }

  // Tapping a colour starts that player's clock (and stops whoever was running).
  function tapPlayer(i) {
    commit();
    state.active = i;
    state.running = true;
    save(); render();
    keepAwake();
  }
  function togglePause() {
    if (state.active === null) return;
    commit();
    state.running = !state.running;
    save(); render();
  }

  // Reset asks once: the button turns red for 3 seconds, a second tap confirms.
  var confirmTimer = null;
  function reset() {
    if (!resetBtn.classList.contains('confirm')) {
      resetBtn.classList.add('confirm');
      resetBtn.textContent = 'Zeker? Tik nogmaals';
      confirmTimer = setTimeout(cancelReset, 3000);
      return;
    }
    cancelReset();
    state = { times: [0, 0, 0], active: null, running: false, since: 0 };
    save(); render();
  }
  function cancelReset() {
    clearTimeout(confirmTimer);
    resetBtn.classList.remove('confirm');
    resetBtn.textContent = 'Reset';
  }

  btns.forEach(function (b, i) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); tapPlayer(i); });
  });
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', reset);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ── screen wake lock ────────────────────────────
  var lock = null;
  function keepAwake() {
    if (!('wakeLock' in navigator)) {
      statusEl.textContent = 'Scherm-aan niet ondersteund in deze browser — zet Automatisch vergrendelen op Nooit';
      return;
    }
    if (lock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      statusEl.textContent = 'Scherm blijft aan';
      l.addEventListener('release', function () { lock = null; statusEl.textContent = ''; });
    }).catch(function () {
      statusEl.textContent = 'Scherm-aan geweigerd — tik op een kleur om opnieuw te proberen';
    });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { render(); keepAwake(); }
  });

  load();
  render();
  keepAwake();
  setInterval(render, 200);
})();
</script>
<!-- BODY-END -->
</body>
</html>
